
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Reservation | Login</title>
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Railway Reservation</h1>
            <p id="form-kicker">WELCOME BACK</p>
            <h2 id="form-title">Welcome Back</h2>
            <p id="form-description">Login to continue your journey</p>

            <div class="auth-tabs">
                <button type="button" id="login-tab" class="active">
                    Login
                </button>
                <button type="button" id="signup-tab">
                    Sign Up
                </button>
            </div>

            <form id="auth-form">
                <div class="form-group" id="username-group" hidden>
                    <label for="username">Full Name</label>
                    <input id="username" name="name" type="text"
                           autocomplete="name">
                </div>

                <div class="form-group" id="email-group" hidden>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email"
                           autocomplete="email">
                </div>

                <div class="form-group" id="identifier-group">
                    <label for="login-identifier">Email</label>
                    <input id="login-identifier" name="identifier"
                           type="email" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input id="password" name="password" type="password"
                               minlength="6" autocomplete="current-password"
                               required>
                        <button type="button" id="toggle-password">
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group" id="confirm-group" hidden>
                    <label for="confirm-password">Confirm Password</label>
                    <div class="password-field">
                        <input id="confirm-password" name="confirmPassword"
                               type="password" minlength="6"
                               autocomplete="new-password">
                        <button type="button" id="toggle-confirm-password">
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-button">
                    <span id="submit-label">Login</span>
                </button>

                <p id="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
